<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">A/V-проверка: исходник, хостинг и плеер</title>
<desc id="desc">Ролик загружается только по команде «Информация → Звук → Воспроизвести». Вспышки совпадают с тонами. Лимит — 15 секунд. Завершение: простой или попытка вернуть актуальный эфир. Остановка просмотра или выбор другого канала отменяют возврат. Отдельный режим «Демо» беззвучен.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49647c"/></marker></defs>
<rect width="1160" height="620" rx="22" fill="#f3f7fc"/>
<g font-family="system-ui, sans-serif" fill="#15324d">
<text x="32" y="49" font-size="28" font-weight="700">A/V-проверка: исходник, хостинг и плеер</text>
<text x="32" y="83" font-size="18" font-weight="400">Ролик загружается только по команде «Информация → Звук → Воспроизвести».</text>
<rect x="32" y="125" width="314" height="265" rx="14" fill="white" stroke="#3e67c8" stroke-width="2"/>
<rect x="32" y="125" width="314" height="53" rx="14" fill="#3e67c8"/>
<text x="50" y="159" font-size="22" font-weight="700" fill="white">1  Репозиторий</text>
<text x="50" y="212" font-size="16" font-weight="400">diagnostics/av-v1.mp4</text>
<text x="50" y="243" font-size="16" font-weight="400">464 652 байта · MIT</text>
<text x="50" y="274" font-size="16" font-weight="400">Генератор и проверка аудио</text>
<text x="50" y="305" font-size="16" font-weight="400">Для воспроизводимости</text>
<text x="50" y="352" font-size="14" font-weight="600">В пакеты плеера не копируется</text>
<path d="M 351 267 H 414" stroke="#49647c" stroke-width="2" marker-end="url(#arrow)"/>
<text text-anchor="middle" x="384" y="250" font-size="11" font-weight="600">Публикация</text>
<rect x="423" y="125" width="314" height="265" rx="14" fill="white" stroke="#0b806d" stroke-width="2"/>
<rect x="423" y="125" width="314" height="53" rx="14" fill="#0b806d"/>
<text x="441" y="159" font-size="22" font-weight="700" fill="white">2  here.now</text>
<text x="441" y="212" font-size="16" font-weight="400">Версионированный HTTPS-файл</text>
<text x="441" y="243" font-size="16" font-weight="400">Те же байты av-v1.mp4</text>
<text x="441" y="274" font-size="16" font-weight="400">H.264 + AAC stereo · 8 секунд</text>
<text x="441" y="305" font-size="16" font-weight="400">Нужен доступ к интернету</text>
<text x="441" y="352" font-size="14" font-weight="600">При старте</text>
<text x="441" y="373" font-size="14" font-weight="600">приложения не запрашивается</text>
<path d="M 742 267 H 805" stroke="#49647c" stroke-width="2" marker-end="url(#arrow)"/>
<text text-anchor="middle" x="775" y="250" font-size="11" font-weight="600">Запуск</text>
<rect x="814" y="125" width="314" height="265" rx="14" fill="white" stroke="#935ab1" stroke-width="2"/>
<rect x="814" y="125" width="314" height="53" rx="14" fill="#935ab1"/>
<text x="832" y="159" font-size="22" font-weight="700" fill="white">3  Плеер</text>
<text x="832" y="212" font-size="16" font-weight="400">Web / интерфейс OTT Server</text>
<text x="832" y="243" font-size="16" font-weight="400">Интерфейс Tauri / Capacitor</text>
<text x="832" y="274" font-size="16" font-weight="400">Управляемый HTML5-путь</text>
<text x="832" y="305" font-size="16" font-weight="400">В простое или прямом эфире</text>
<text x="832" y="352" font-size="14" font-weight="600">Не VOD, архив или сменный движок</text>
<text x="32" y="433" font-size="22" font-weight="700">Что должно быть видно и слышно</text>
<rect x="32" y="452" width="263" height="56" rx="9" fill="#dde7fc"/>
<text x="47" y="487" font-size="17" font-weight="600">0–2 с  Слева · 440 Гц</text>
<rect x="307" y="452" width="263" height="56" rx="9" fill="#d5f0e9"/>
<text x="322" y="487" font-size="17" font-weight="600">2–4 с  Справа · 880 Гц</text>
<rect x="582" y="452" width="263" height="56" rx="9" fill="#eddef6"/>
<text x="597" y="487" font-size="17" font-weight="600">4–6 с  Оба канала</text>
<rect x="857" y="452" width="263" height="56" rx="9" fill="#e1e7ed"/>
<text x="872" y="487" font-size="17" font-weight="600">6–8 с  Тишина</text>
<text x="32" y="550" font-size="16" font-weight="400">Вспышки совпадают с тонами. Лимит — 15 секунд. Завершение: простой или попытка вернуть актуальный эфир.</text>
<text x="32" y="581" font-size="16" font-weight="400">Остановка просмотра или выбор другого канала отменяют возврат. Отдельный режим «Демо» беззвучен.</text>
</g></svg>
