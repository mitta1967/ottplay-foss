<svg xmlns="http://www.w3.org/2000/svg" width="920" height="570" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">Finite live stream recovery</title>
<desc id="desc">One playback lease prepares source and quality limits. Fatal transient errors have two retries total. Explicit live backups advance once each. Access and quality errors terminate. Stop or source replacement cancels pending work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="920" height="570" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#172033" text-anchor="middle">
<text x="460" y="38" font-size="24" font-weight="600">One lease. A finite recovery budget.</text>
<g fill="#f1f5f9" stroke="#94a3b8"><rect x="285" y="62" width="350" height="55" rx="8"/><rect x="285" y="152" width="350" height="66" rx="8"/><rect x="285" y="250" width="350" height="55" rx="8"/><rect x="32" y="350" width="240" height="76" rx="8"/><rect x="325" y="350" width="270" height="76" rx="8"/><rect x="648" y="350" width="240" height="76" rx="8"/></g>
<g font-size="16"><text x="460" y="96">Selected channel · one playback lease</text><text x="460" y="179">Prepare source</text><text x="460" y="201">Apply HLS / Shaka quality limits</text><text x="460" y="283">Play current endpoint</text><text x="152" y="377">Transient failure</text><text x="152" y="401">≤ 2 delayed retries total</text><text x="460" y="377">Explicit live backups</text><text x="460" y="401">≤ 3 forward moves total</text><text x="768" y="377">Access / quality / exhausted</text><text x="768" y="401">Visible failure · no loop</text></g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M460 117V152"/><path d="M460 218V250"/><path d="M365 305L152 350"/><path d="M460 305V350"/><path d="M555 305L768 350"/><path d="M32 386H14V186H285"/><path d="M460 426V456H660V186H635"/></g>
<text x="178" y="173" font-size="13">pause-aware delay</text><text x="713" y="445" font-size="13">next endpoint, once</text>
<rect x="72" y="488" width="776" height="54" rx="8" fill="#eef2ff" stroke="#818cf8"/>
<text x="460" y="512" font-size="15" font-weight="600">Stop · standby · source replacement · channel replacement</text><text x="460" y="532" font-size="14">Cancel pending work; late callbacks cannot restart the old request</text>
</g></svg>
