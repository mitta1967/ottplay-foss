<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1056" viewBox="0 0 1280 1056" role="img" aria-labelledby="title description">
  <title id="title">Plex local validation results at code freeze bc81e98e</title>
  <desc id="description">Local validation evidence for OTTPlay FOSS, source commit bc81e98e. Chromium passed 13 applicable checks; one native HLS check is WebKit only and is not applicable to Chromium. WebKit passed all 14 checks. Trusted touch passed in all three browser engines. Separate suites passed 41 Plex client scenarios, 20 Plex authentication scenarios using real jQuery 1.11.1 and 4.0, 39 remote Plex groups, and 134 media library groups. Scenario and group counts are different units, not comparable coverage measures. Typecheck, lint, unified tests, build, ES5, bundle, and size gates passed locally. Complete player size is 964842 bytes against a limit of 964900 bytes, leaving 58 bytes. This snapshot does not assert CI status or publication of a beta release.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f35"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <linearGradient id="passed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cc9b3"/>
      <stop offset="1" stop-color="#83e3cc"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #edf4fc; }
      .muted { fill: #b5c4d8; }
      .teal { fill: #83e3cc; }
      .blue { fill: #9ebeff; }
      .amber { fill: #f0ce8e; }
      .panel { fill: #14243a; stroke: #30435b; stroke-width: 1; }
      .chip { fill: #143b3c; stroke: #28665e; stroke-width: 1; }
      .check { fill: none; stroke: #83e3cc; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="1056" rx="24" fill="url(#background)"/>
  <rect x="64" y="58" width="7" height="39" rx="3.5" fill="#83e3cc"/>
