  <path d="M904 834l5 5 9-10" class="check"/>
  <text x="928" y="840" class="teal" font-size="16">Bundle</text>
  <rect x="1046" y="814" width="142" height="40" rx="10" class="chip"/>
  <path d="M1061 834l5 5 9-10" class="check"/>
  <text x="1085" y="840" class="teal" font-size="16">Size</text>

  <text x="92" y="893" class="muted" font-size="18">Complete player: <tspan class="ink" font-weight="600">964,842 bytes</tspan><tspan> / 964,900-byte limit</tspan></text>
  <text x="1188" y="893" text-anchor="end" class="amber" font-size="17">58 bytes headroom</text>

  <text x="64" y="975" class="amber" font-size="16" font-weight="700" letter-spacing="1.5">LOCAL EVIDENCE ONLY</text>
