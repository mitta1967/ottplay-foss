  <text x="64" y="138" class="ink" font-size="43" font-weight="700">Plex: results at code freeze</text>
  <text x="65" y="174" class="muted" font-size="21">Source <tspan class="ink" font-family="monospace" font-weight="700">bc81e98e</tspan><tspan>  ·  Local evidence before publication</tspan></text>
  <rect x="961" y="58" width="255" height="40" rx="20" class="chip"/>
  <circle cx="984" cy="78" r="5" fill="#83e3cc"/>
  <text x="1001" y="84" class="teal" font-size="15" font-weight="700" letter-spacing="0.8">LOCAL GATES PASSED</text>

  <rect x="64" y="210" width="1152" height="290" rx="18" class="panel"/>
  <text x="92" y="250" class="ink" font-size="23" font-weight="700">Browser checks</text>
  <text x="1188" y="249" text-anchor="end" class="muted" font-size="16">Passed / applicable</text>

  <text x="92" y="298" class="ink" font-size="22" font-weight="600">Chromium</text>
  <rect x="349" y="281" width="563" height="16" rx="8" fill="url(#passed)"/>
  <text x="948" y="299" class="teal" font-size="25" font-weight="700">13 / 13</text>
  <text x="349" y="328" class="amber" font-size="16">1 native-HLS check is WebKit only; not applicable here.</text>

  <text x="92" y="374" class="ink" font-size="22" font-weight="600">WebKit</text>
  <rect x="349" y="357" width="563" height="16" rx="8" fill="url(#passed)"/>
  <text x="948" y="375" class="teal" font-size="25" font-weight="700">14 / 14</text>

  <text x="92" y="435" class="ink" font-size="22" font-weight="600">Trusted touch</text>
  <rect x="349" y="418" width="563" height="16" rx="8" fill="url(#passed)"/>
  <text x="948" y="436" class="teal" font-size="25" font-weight="700">3 / 3 <tspan font-size="17" font-weight="400">engines</tspan></text>
  <text x="92" y="476" class="muted" font-size="16">Bars show successful applicable checks, not code coverage.</text>

  <text x="64" y="547" class="ink" font-size="23" font-weight="700">Separate regression suites</text>
  <text x="1216" y="546" text-anchor="end" class="muted" font-size="16">Counts use different units; do not sum or compare as coverage.</text>

