[package]
name = "ottplay-updater-zip-regression"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-no-provider"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

[dev-dependencies]
tempfile = "3"
zip = { version = "=9.0.0", default-features = false }
reqwest = { version = "=0.13.4", default-features = false }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
